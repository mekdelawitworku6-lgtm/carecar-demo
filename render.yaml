# Render Blueprint — https://dashboard.render.com/select-repo?type=blueprint
# Push this folder to a GitHub repo, then choose "Use Blueprint".
services:
  - type: web
    name: carecar-portfolio-demo
    displayName: CareCar — Portfolio Demo
    runtime: static
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
